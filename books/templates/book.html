<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>{{ book.title }}</title>
  </head>
  <body>
    {% if book %}
      <h1>{{ book.title }}</h1>
      <h2>{{ book.author_full_name }}</h2>
      <h2>{{ book.year_of_publishing }}</h2>
      <h2>{{ book.copies_printed }}</h2>
      <h2>{{ book.short_description }}</h2>
    {% else %}
      <h1>Такой книги нет у нас</h1>
    {% endif %}
  </body>
</html>
